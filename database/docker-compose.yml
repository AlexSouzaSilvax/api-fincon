version: '3.8'

services:
  database_mysql:
    image: mysql/mysql-server:latest
    container_name: mysql_local
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "1234"
      MYSQL_DATABASE: "fincon"
      MYSQL_USER: "admin"
      MYSQL_PASSWORD: "1234"
  fincon_db:
    image: postgres:17
    container_name: postgres_local
    ports:
      - "54322:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: fincon
    restart: always

